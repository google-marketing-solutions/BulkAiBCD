substitutions:
  _REGION: us-central1
  _REPO: bulkaibcd
  _IMAGE: bulkaibcd
  _SERVICE: bulkaibcd
  _RUNTIME_SA: bulkaibcd-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_TASKS_QUEUE: bulkaibcd-queue
  _UPLOADS_BUCKET: bulkaibcd-uploads-${PROJECT_ID}
  _APP_BACKEND_URL: ""
  _IAP_CLIENT_ID: ""
  # Audience claim carried by IAP assertions for this service. Read it from the
  # "IAP assertion claims observed" log line after the first deploy, set it here, then flip
  # _IAP_ENFORCE_AUDIENCE to true so assertions minted for other apps are rejected.
  _IAP_AUDIENCE: ""
  _IAP_ENFORCE_AUDIENCE: "false"


steps:
  # 1. Build Frontend (Angular)
  - id: 'FE-Install'
    name: 'node:18'
    entrypoint: 'npm'
    args: ['--prefix', 'ui', 'install']

  - id: 'FE-Build'
    name: 'node:18'
    entrypoint: 'npm'
    args: ['--prefix', 'ui', 'run', 'build', '--', '--configuration', 'production']

  # 2. Copy FrontendStatic Assets to Backend
  - id: 'Copy-Static'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p src/main/resources/static
        cp -r ui/dist/bulkaibcd/browser/* src/main/resources/static/

  # 3. Build Backend (Maven) - Now has native access to Artifact Registry credentials!
  - id: 'BE-Build'
    name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'mvn'
    args: ['package', '-Dmaven.test.skip=true', '-Dhttp.keepAlive=false', '-Dmaven.wagon.http.retryHandler.count=3']

  # 4. Build Docker Image (Quickly)
  - id: 'Build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest'
      - '.'

  # 5. Push
  - id: 'Push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}'

  # 6. Deploy
  - id: 'Deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--timeout=600s'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--service-account=${_RUNTIME_SA}'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--cpu-boost'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},SPRING_CLOUD_GCP_LOGGING_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=${_CLOUD_TASKS_QUEUE},CLOUD_TASKS_SERVICE_ACCOUNT=${_RUNTIME_SA},APP_BACKEND_URL=${_APP_BACKEND_URL},UPLOADS_BUCKET=${_UPLOADS_BUCKET},IAP_CLIENT_ID=${_IAP_CLIENT_ID},IAP_AUDIENCE=${_IAP_AUDIENCE},IAP_ENFORCE_AUDIENCE=${_IAP_ENFORCE_AUDIENCE}'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest'
